const G={y:['1842','1856','1858','1860','1876','1894','1895','1904','1905','1910','1919','1931','1937','1941','1945','1954','1955','1961','1969','1971','1973'],n:['10','17','23','25','26','29','38','50','100','103','200'],t:['난징','톈진','시모노세키','신축','포츠머스','바우링','사이공','화친','수호 통상','가쓰라·태프트','강화도','제네바','파리 평화','정전 협정'],c:['프랑스','영국','러시아','한국','일본','미국','타이','태국','이탈리아','에스파냐','소련','인도네시아','필리핀','말레이시아','독일','네덜란드','중국','베트남','캄보디아','미얀마','타이완','인도'],p:['홍콩','주룽반도','충칭','상하이','난징','베이징','뤼순','다롄','진주만','미드웨이','쓰시마','오키나와','에조치','쿠릴','알뜨르','진먼다오','판문점','괌','메콩강','믈라카','수에즈','도쿄','바탄','싱가포르','수마트라','보르네오','말라야','푸순','군산','달랏','가오슝','하와이','서울','안동','칼랑','미라이','태평양'],h:['푸이','호찌민','아웅 산','김원봉','가지 와타루','리요우방','자멘호프','수카르노','닉슨','키신저','마오쩌둥','저우언라이','네루','이홍장','맥아더','폴 포트'],e:['운요호','동학 농민','의화단','만주 사변','루거우차오','3·1','5·4','갑신정변','통킹만','골드러시','대공황','핑퐁','킬링 필드','1·21','난징 대학살'],g:['경복궁','창덕궁','창경궁','덕수궁','경희궁'],w:['러일','청일','청프','중일','아편','인도차이나']};
